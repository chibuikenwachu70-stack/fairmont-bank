<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign In | Fairmont Bank</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <main class="login-page">

        <div class="login-shell">

            <a
                href="/"
                class="back-button"
                aria-label="Go back">
                ←
            </a>

            <div class="login-brand">

                <div class="brand-mark">
                    F
                </div>

                <div class="brand-name">

                    <strong>FAIRMONT</strong>

                    <span>BANK</span>

                </div>

            </div>


            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <section class="login-intro">

                <p class="eyebrow">
                    CUSTOMER BANKING
                </p>

                <h1>
                    Welcome<br>
                    back.
                </h1>

                <p>
                    Sign in securely to access your Fairmont Bank account.
                </p>

            </section>


            <form
                class="login-form"
                method="POST"
                action="/login">

                <div class="form-group">

                    <label for="customer-id">
                        Customer ID
                    </label>

                    <input
                        type="text"
                        id="customer-id"
                        name="customer_id"
                        placeholder="Enter your Customer ID"
                        autocomplete="username"
                        autocapitalize="characters"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password">

                            Show

                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            name="remember">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="#"
                        class="forgot-link">

                        Forgot password?

                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Sign in

                </button>

            </form>


            <div class="new-customer">

                <span>
                    Don't have a Fairmont account?
                </span>

                <a href="/open-account">
                    Open an account
                </a>

            </div>


            <div class="security-note">

                <span class="security-icon">
                    ✓
                </span>

                <span>
                    Your connection is protected by secure encryption.
                </span>

            </div>

        </div>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                password.type = "password";

                button.textContent = "Show";

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    </script>

</body>

</html>
