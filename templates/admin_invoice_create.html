<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Invoice | Fairmont Bank</title><style>
body{margin:0;background:#071426;color:#eef3fb;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:35px auto;padding:0 20px}.card{background:#0d1d33;border:1px solid #203654;border-radius:18px;padding:28px}.brand{color:#d8b76a;font-weight:700;letter-spacing:1.5px}.back{color:#fff;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;margin:5px 0 7px;color:#b8c5d7;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;background:#071426;border:1px solid #2a4363;color:#fff;padding:12px;border-radius:9px}textarea{min-height:100px;resize:vertical}.btn{background:#a77e2f;color:#fff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}.errors{background:#4a251f;padding:12px;border-radius:9px;margin-bottom:15px}.help{color:#91a1b6;font-size:12px;margin-top:6px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><a class="back" href="{{ url_for('admin_invoices') }}">← Bills & Invoices</a><div class="card"><div class="brand">FAIRMONT BANK</div><h1>Create Invoice</h1>{% if errors %}<div class="errors">{% for error in errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}<form method="post"><div class="grid"><div><label>Customer</label><select name="customer_id" required><option value="">Select customer</option>{% for customer in customers %}<option value="{{ customer.customer_id }}" {% if form.get('customer_id')==customer.customer_id %}selected{% endif %}>{{ customer.full_name }} — {{ customer.customer_id }}</option>{% endfor %}</select></div><div><label>Billing type</label><select name="billing_type" required><option value="">Select billing type</option>{% for item in billing_types %}<option {% if form.get('billing_type')==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="full"><label>Description</label><input name="description" value="{{ form.get('description','') }}" maxlength="500" required></div><div><label>Base amount</label><input name="amount" type="number" min="0" step="0.01" value="{{ form.get('amount','0.00') }}" required></div><div><label>TCC tax</label><input name="tcc_tax" type="number" min="0" step="0.01" value="{{ form.get('tcc_tax','0.00') }}"><div class="help">Use only for an applicable, accurately identified tax assessment.</div></div><div><label>Other fee</label><input name="other_fee" type="number" min="0" step="0.01" value="{{ form.get('other_fee','0.00') }}"></div><div><label>Discount</label><input name="discount" type="number" min="0" step="0.01" value="{{ form.get('discount','0.00') }}"></div><div><label>Due date</label><input name="due_date" type="date" value="{{ form.get('due_date',today) }}" required></div><div class="full"><label>Billing note</label><textarea name="billing_note" maxlength="1000">{{ form.get('billing_note','') }}</textarea></div></div><p><button class="btn" type="submit">Create Invoice</button></p></form></div></div></body></html>
