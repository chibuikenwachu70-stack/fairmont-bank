<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Fairmont Bank</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e6edf5;font:15px Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(480px,100%);background:#0b192b;border:1px solid #26364b;border-radius:16px;padding:28px;box-shadow:0 18px 48px #0003}.brand{color:#d8b96a;font-weight:700;letter-spacing:1px}h1{font-size:27px;margin:18px 0 8px}p{color:#aebed0;line-height:1.6}label{display:block;color:#c4d0df;font-size:13px;margin:16px 0 7px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #34465c;background:#071321;color:#fff;font:inherit}button{display:inline-block;margin-top:20px;background:#c5a052;color:#07111f;border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}.message{padding:12px;border-radius:8px;background:#153b2a;color:#b9f0ce;line-height:1.5}a{color:#d8b96a}.back{display:block;margin-top:18px}</style></head>
<body><main class="panel"><div class="brand">FAIRMONT BANK</div><h1>Choose a new password</h1><p>Your reset link is single-use and expires after 30 minutes.</p>
{% if message %}<div class="message">{{ message }}</div>{% endif %}
{% if not invalid %}<form method="post"><label for="password">New password (at least 10 characters)</label><input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password"><button type="submit">Reset password</button></form>{% endif %}
<a class="back" href="{{ url_for('login') }}">Back to sign in</a><p style="font-size:12px;margin-top:22px">Never share password-reset links or passwords.</p></main></body></html>
