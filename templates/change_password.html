<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password - Fairmont Bank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(35, 76, 125, 0.28), transparent 38%),
                linear-gradient(180deg, #07182d 0%, #061426 100%);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .password-page {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 22px 18px 45px;
        }

        .password-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 25px;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.10);
            font-size: 22px;
        }

        .password-title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .password-subtitle {
            margin: 4px 0 0;
            color: rgba(255,255,255,0.60);
            font-size: 13px;
        }

        .password-card {
            background: rgba(13, 34, 59, 0.84);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.70);
            font-size: 12px;
            font-weight: 600;
        }

        .password-input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.055);
            color: #ffffff;
            outline: none;
            font-size: 14px;
        }

        .password-input:focus {
            border-color: rgba(110,170,230,0.55);
            background: rgba(255,255,255,0.075);
        }

        .password-input::placeholder {
            color: rgba(255,255,255,0.32);
        }

        .requirements {
            margin: 3px 0 20px;
            color: rgba(255,255,255,0.48);
            font-size: 12px;
            line-height: 1.5;
        }

        .submit-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #1f5d96;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #276da9;
        }

        .message {
            margin-bottom: 18px;
            padding: 13px 14px;
            border-radius: 11px;
            font-size: 12px;
            line-height: 1.45;
        }

        .error-message {
            background: rgba(180,55,55,0.15);
            border: 1px solid rgba(230,90,90,0.22);
            color: #ffb0b0;
        }

        .success-message {
            background: rgba(65,155,105,0.15);
            border: 1px solid rgba(90,190,130,0.22);
            color: #9de0b7;
        }

        @media (max-width: 600px) {

            .password-page {
                padding: 18px 14px 35px;
            }

            .password-title {
                font-size: 22px;
            }

            .password-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="password-page">

    <div class="password-header">

        <a href="{{ url_for('settings') }}" class="back-button">
            ‹
        </a>

        <div>
            <h1 class="password-title">
                Change Password
            </h1>

            <p class="password-subtitle">
                Update your Fairmont Bank sign-in password
            </p>
        </div>

    </div>


    <div class="password-card">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message
                        {% if category == 'success' %}
                            success-message
                        {% else %}
                            error-message
                        {% endif %}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST" action="{{ url_for('change_password') }}">

            <div class="form-group">

                <label class="form-label" for="current_password">
                    Current Password
                </label>

                <input
                    class="password-input"
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter your current password"
                    required
                    autocomplete="current-password">

            </div>


            <div class="form-group">

                <label class="form-label" for="new_password">
                    New Password
                </label>

                <input
                    class="password-input"
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter your new password"
                    required
                    minlength="8"
                    autocomplete="new-password">

            </div>


            <div class="form-group">

                <label class="form-label" for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    class="password-input"
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your new password"
                    required
                    minlength="8"
                    autocomplete="new-password">

            </div>


            <p class="requirements">
                Your new password must contain at least 8 characters.
            </p>


            <button type="submit" class="submit-button">
                Change Password
            </button>

        </form>

    </div>

</div>

</body>
</html>
